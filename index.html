<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASP Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Header Landmark (Deep Navy) -->
<header class="site-header">
    <h1>ASP student Portal</h1>
  </header>


  <!-- Main Container: Flexbox side-by-side card boxes -->
  <main class="dashboard-container ">


    <!-- BOX 1: Course Registration Form Card -->
    <section class="card-box">
      <h2>Register for Course</h2>
      <form action="/register" method="POST">
    <div class="site-header">
         <label for="naem">student name:</label>
        <input type="name" id="name" name="name">
    </div>
     <div class="site-header">
       <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" >
    </div>

        <button type="submit" class="submit-btn">Submit Registration</button>
      </form>
    </section> 


    <!-- BOX 2: Class Schedule Table Card -->
    <section class="site-header">
      <h2>Upcoming Schedule</h2>
      <table class="site-header">
        <thead>
      <tr>
    <!-- Spans across 2 columns -->
    <th colspan="2"></th>
  </tr>
  <tr>
    <td>Row 1, Cell 1</td>
    <td>Row 1, Cell 2</td>
  </tr>
      </table>
    </section>


  </main>


  <!-- Footer Landmark with External Blank Target Link -->
  <footer class="site-header">
    <p> <a href="" target=""></a></p>
  </footer>


</body>
</html>
